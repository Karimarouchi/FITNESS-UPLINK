spring:
  application:
    name: fitness-uplink-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 8000
          timeout: 8000
          writetimeout: 8000

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  tomcat:
    max-http-form-post-size: 55MB
  error:
    include-stacktrace: never
    include-message: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.mail: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  security:
    jwt:
      secret: ${JWT_SECRET:fitness-uplink-local-dev-jwt-secret-key-must-be-at-least-64-bytes-long!}
      access-token-ttl: 15m
    refresh-token:
      cookie-name: refresh_token
      cookie-path: /api/v1/auth
      ttl: 12h
      remember-me-ttl: 30d
    cookie:
      secure: ${COOKIE_SECURE:false}
    lockout:
      max-attempts: 3
      duration: 1m
    super-admin:
      email: ${SUPER_ADMIN_EMAIL:Admin@Antigoneagency.com}
      password: ${SUPER_ADMIN_PASSWORD:Admin@123456}
      first-name: Admin
      last-name: Antigone
  uploads:
    dir: ${UPLOADS_DIR:uploads}
    max-bytes: 52428800
  signature:
    provider: ${SIGNATURE_PROVIDER:mock}
    webhook-secret: ${SIGNATURE_WEBHOOK_SECRET:fitness-uplink-local-webhook-secret}
    fail-send: ${SIGNATURE_FAIL_SEND:false}
  mail:
    from-name: Fitness Uplink
    from-email: ${MAIL_FROM:${MAIL_USERNAME:}}
    code-ttl: 10m
    resend-cooldown: 60s
    max-attempts: 5
    settings-secret: ${MAIL_SETTINGS_SECRET:${JWT_SECRET:}}
  recaptcha:
    secret: ${RECAPTCHA_SECRET:}
    min-score: 0.5
  frontend:
    base-url: ${FRONTEND_URL:http://localhost:5173}
