spring:
  application:
    name: fitness-uplink-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  tomcat:
    max-http-form-post-size: 55MB
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  security:
    jwt:
      secret: ${JWT_SECRET:fitness-uplink-local-dev-jwt-secret-key-must-be-at-least-64-bytes-long!}
      access-token-ttl: 15m
    refresh-token:
      cookie-name: refresh_token
      cookie-path: /api/v1/auth
      ttl: 12h
      remember-me-ttl: 30d
    cookie:
      secure: ${COOKIE_SECURE:false}
    lockout:
      max-attempts: 5
      duration: 15m
    super-admin:
      email: Admin@Antigoneagency.com
      password: "Admin@123456"
      first-name: Admin
      last-name: Antigone
  uploads:
    dir: ${UPLOADS_DIR:uploads}
    max-bytes: 52428800
  signature:
    provider: ${SIGNATURE_PROVIDER:mock}
    webhook-secret: ${SIGNATURE_WEBHOOK_SECRET:fitness-uplink-local-webhook-secret}
    fail-send: ${SIGNATURE_FAIL_SEND:false}
