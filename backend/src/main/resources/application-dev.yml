spring:
  # Local secrets (SMTP…) live in an untracked .env — backend/ when run from there, repo root from an IDE.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:fitness_uplink}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:admin}
  jpa:
    show-sql: false
  mail:
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

app:
  demo-seed:
    enabled: ${DEMO_SEED_ENABLED:true}
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:5175
  security:
    cookie:
      secure: false
  mail:
    from-email: ${MAIL_FROM:${MAIL_USERNAME:}}
  recaptcha:
    secret: ${RECAPTCHA_SECRET:}
