# Used by the production "web" container (see docker-compose.prod.yml).
# Serves the built SPA and proxies /api to the "api" service on the compose network.

# Keep the original scheme sent by the host nginx (https once TLS is enabled), fall back to ours.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Client IP chain: the host nginx OVERWRITES X-Forwarded-For with the real client address, and this
# container forwards it unchanged (it never appends to a client-supplied value). The backend only
# trusts it because the peer is a private proxy, and this port is bound to 127.0.0.1 on the host.
map $http_x_forwarded_for $forwarded_for {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend accepts uploads up to 50 MB (+ multipart overhead).
    client_max_body_size 55m;

    add_header X-Content-Type-Options "nosniff" always;

    # Re-resolve "api" through Docker's DNS so recreating the api container never leaves a stale IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback: any other path serves index.html (never cached so deploys show immediately).
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
