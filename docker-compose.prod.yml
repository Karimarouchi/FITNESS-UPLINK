# Production stack: PostgreSQL + Spring Boot API + web (nginx serving the SPA and proxying /api).
# Everything is built inside Docker; nothing needs to be installed on the host except Docker.
#
#   cp .env.prod.example .env      # then fill in the values
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only the web container is reachable from the host, on 127.0.0.1:8085. The host nginx forwards to it.
name: fitness-uplink

services:
  db:
    image: postgres:16-alpine
    container_name: fitness-uplink-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fitness_uplink}
      POSTGRES_USER: ${POSTGRES_USER:-fitness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
    volumes:
      - fu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitness} -d ${POSTGRES_DB:-fitness_uplink}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: fitness-uplink-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: db
      JAVA_TOOL_OPTIONS: -Xmx512m
      UPLOADS_DIR: /data/uploads
    mem_limit: 800m
    volumes:
      - fu_uploads:/data/uploads

  web:
    build:
      context: ./frontend
      args:
        VITE_RECAPTCHA_SITE_KEY: ${VITE_RECAPTCHA_SITE_KEY:-}
    container_name: fitness-uplink-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8085:80"

volumes:
  fu_pgdata:
  fu_uploads:
